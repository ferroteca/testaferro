version = 1
SPDX-PackageName = "testaferro"
SPDX-PackageSupplier = "Paul Galbraith <paul@galbraiths.ca>"

# Files that cannot (or should not) carry comment headers.
[[annotations]]
path = [
    ".editorconfig",
    ".gitignore",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "BSD-3-Clause"

# The built guest suite: a DOS executable, so it can carry no header
# at all. Its source and its build recipe sit beside it, which is what
# makes the binary reproducible rather than opaque.
[[annotations]]
path = ["tests/integration/guest/SUITE.EXE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "BSD-3-Clause"
