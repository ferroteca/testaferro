[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-testaferro"
version = "0.1.0.a3"
description = "pytest plugin for DOS-based CppUTest unit testing, run in a reliquary guest"
readme = "README.md"
authors = [{ name = "Paul Galbraith", email = "paul@galbraiths.ca" }]
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["pytest", "cpputest", "reliquary", "dos", "testing", "guest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# pytest is the facade's host surface (testaferro.facade). The provider binding
# requires reliquary, which is included as a dependency. remanence is the
# at-rest seam: it opens the guest's own drive images to stage the suite and
# read it back, which is not the provider's work (F16, D23).
dependencies = ["pytest", "reliquary==0.1.0a2", "remanence==0.0.1a6"]

[project.urls]
Repository = "https://github.com/ferroteca/testaferro"

# Auto-loading is the point: `pytest tests/SUITE.EXE` works the moment
# the distribution is installed, with no wrapper and no flag in front
# of it (D13). The claiming policy in src/testaferro/plugin.py is what
# makes that safe — a tree scan claims nothing that was not opted in.
[project.entry-points.pytest11]
testaferro = "testaferro.plugin"

[tool.setuptools.packages.find]
where = ["src"]

# The FreeDOS recipe testaferro authors and installs from (P17). It is
# data the package reads at run time, so it ships inside the package
# rather than sitting beside it in the repository.
[tool.setuptools.package-data]
testaferro = ["assets/*.rlqb", "assets/*.rlqs"]
