#
# The tombstone release for the retired `testaferro` distribution
# name (D12): a final metadata-only package that redirects to
# pytest-testaferro. Published once; never released again.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "testaferro"
version = "0.1.0.dev4"
description = "Renamed: install pytest-testaferro instead."
readme = "README.md"
authors = [{ name = "Paul Galbraith", email = "paul@galbraiths.ca" }]
requires-python = ">=3.9"
license = "BSD-3-Clause"
keywords = ["pytest", "testaferro", "renamed"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Framework :: Pytest",
]
# Stale pins on the old name resolve to the real distribution.
dependencies = ["pytest-testaferro"]

[project.urls]
Repository = "https://github.com/ferroteca/testaferro"

[tool.setuptools]
packages = []
